<!DOCTYPE html>
<html lang="ru" data-theme="obsidian-amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Настройки — Server Monitor</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Petroprog">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('sm_settings_v1');
        var cfg = raw ? JSON.parse(raw) : {};
        var colors = { 'obsidian-amber': '#0d0d0f', 'nordic-paper': '#f6f5f0', 'emerald-ops': '#090e0c', 'velvet-coral': '#110e15' };
        var th = colors[cfg.theme] ? cfg.theme : 'obsidian-amber';
        document.documentElement.dataset.theme = th;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', colors[th]);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/themes.css?v=1">
  <link rel="stylesheet" href="/css/app.css?v=1">
</head>
<body>

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand-wrap">
        <h1 class="brand-title" data-i18n="settingsTitle">Настройки</h1>
      </div>

      <nav class="desktop-nav" aria-label="Main">
        <a href="/server" data-nav="server" data-i18n="navServer">Сервер</a>
        <a href="/agents" data-nav="agents" data-i18n="navAgents">Агенты</a>
        <a href="/settings" data-nav="settings" data-i18n="navSettings">Настройки</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="app-shell">
    <!-- Theme Presets -->
    <section class="card card-pad">
      <div class="card-head">
        <h2 class="card-title" data-i18n="themeSection">Тема оформления</h2>
      </div>
      <div id="theme-grid" class="theme-grid"></div>
    </section>

    <!-- Refresh Interval -->
    <section class="card card-pad">
      <div class="card-head">
        <h2 class="card-title" data-i18n="intervalSection">Интервал обновления</h2>
      </div>
      <div id="interval-seg" class="segmented"></div>
    </section>

    <!-- Language (RU / EN only) -->
    <section class="card card-pad">
      <div class="card-head">
        <h2 class="card-title" data-i18n="langSection">Язык интерфейса</h2>
      </div>
      <div id="lang-seg" class="segmented"></div>
    </section>

    <!-- PWA Controls -->
    <section class="card card-pad" style="display:flex;flex-direction:column;gap:0.625rem;">
      <div class="card-head" style="margin-bottom:0.1rem;">
        <h2 class="card-title" data-i18n="pwaSection">Приложение (PWA)</h2>
      </div>
      <button id="pwa-install-btn" type="button" class="btn-primary" data-i18n="pwaInstallBtn">Установить приложение</button>
      <div id="pwa-hint-box" class="hint-box hidden"></div>
      <button id="pwa-reset-btn" type="button" class="btn-secondary" data-i18n="pwaResetBtn">Сбросить кэш</button>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <div class="bottom-nav-inner">
      <a href="/server" class="bottom-tab" data-nav="server">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
        </svg>
        <span data-i18n="navServer">Сервер</span>
      </a>
      <a href="/agents" class="bottom-tab" data-nav="agents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span data-i18n="navAgents">Агенты</span>
      </a>
      <a href="/settings" class="bottom-tab" data-nav="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="navSettings">Настройки</span>
      </a>
    </div>
  </nav>

  <script type="module" src="/js/pages/settings.js?v=1"></script>
</body>
</html>
