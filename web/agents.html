<!DOCTYPE html>
<html lang="ru" data-theme="obsidian-amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Питание и Агенты — Server Monitor</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Server Monitor">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('sm_settings_v1');
        var cfg = raw ? JSON.parse(raw) : {};
        var colors = { 'obsidian-amber': '#0d0d0f', 'nordic-paper': '#f6f5f0', 'emerald-ops': '#090e0c', 'velvet-coral': '#110e15' };
        var th = colors[cfg.theme] ? cfg.theme : 'obsidian-amber';
        document.documentElement.dataset.theme = th;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', colors[th]);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/themes.css?v=1">
  <link rel="stylesheet" href="/css/app.css?v=1">
</head>
<body>

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand-wrap">
        <h1 class="brand-title" data-i18n="agentsTitle">Питание и Агенты</h1>
      </div>

      <nav class="desktop-nav" aria-label="Main">
        <a href="/server" data-nav="server" data-i18n="navServer">Сервер</a>
        <a href="/agents" data-nav="agents" data-i18n="navAgents">Агенты</a>
        <a href="/settings" data-nav="settings" data-i18n="navSettings">Настройки</a>
      </nav>

      <div class="header-actions">
        <button id="refresh-btn" type="button" class="icon-btn" aria-label="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <div class="agents-grid">
      <!-- Nokia 6.1 Battery Card -->
      <article class="card card-pad">
        <div class="card-head">
          <h2 class="card-title" data-i18n="nokiaTitle">Nokia 6.1</h2>
          <span id="nokia-status-pill" class="pill">--</span>
        </div>
        <div style="display:flex;align-items:center;gap:0.875rem;margin-bottom:0.625rem;">
          <div id="nokia-level" class="mono" style="font-size:1.75rem;font-weight:800;line-height:1;">--%</div>
          <div style="flex:1;">
            <div class="bar-track" style="height:0.55rem;"><div id="nokia-bar" class="bar-fill" style="width:0%"></div></div>
          </div>
        </div>
        <div class="kpi-sub" style="margin-bottom:0.35rem;" data-i18n="nokiaHistoryLabel">Разряд 24ч</div>
        <div id="nokia-spark" class="spark-wrap" style="height:2.4rem;margin-bottom:0.4rem;"></div>
        <div id="nokia-updated" class="kpi-sub">--</div>
      </article>

      <!-- Server Sensors & Network Card -->
      <article class="card card-pad">
        <div class="card-head">
          <h2 class="card-title" data-i18n="sensorsTitle">Сенсоры и Сеть</h2>
        </div>
        <div id="sensors-list" class="kv-list">
          <div class="empty-state">...</div>
        </div>
      </article>

      <!-- Telegram Watchdogs Card -->
      <article class="card card-pad">
        <div class="card-head">
          <h2 class="card-title" data-i18n="watchdogsTitle">Telegram Watchdogs</h2>
        </div>
        <div id="watchdogs-list" class="kv-list">
          <div class="empty-state">...</div>
        </div>
      </article>

      <!-- Quick Links Card -->
      <article class="card card-pad">
        <div class="card-head">
          <h2 class="card-title" data-i18n="linksTitle">Сервисы сервера</h2>
        </div>
        <div class="quick-links-grid">
          <a id="link-beszel" href="http://127.0.0.1:8090" target="_blank" rel="noopener noreferrer" class="quick-link-btn">
            <span>Beszel Hub</span>
            <span class="mono">:8090 ↗</span>
          </a>
          <a id="link-adguard" href="http://127.0.0.1:3053" target="_blank" rel="noopener noreferrer" class="quick-link-btn">
            <span>AdGuard Home</span>
            <span class="mono">:3053 ↗</span>
          </a>
        </div>
      </article>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <div class="bottom-nav-inner">
      <a href="/server" class="bottom-tab" data-nav="server">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
        </svg>
        <span data-i18n="navServer">Сервер</span>
      </a>
      <a href="/agents" class="bottom-tab" data-nav="agents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span data-i18n="navAgents">Агенты</span>
      </a>
      <a href="/settings" class="bottom-tab" data-nav="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="navSettings">Настройки</span>
      </a>
    </div>
  </nav>

  <script type="module" src="/js/pages/agents.js?v=1"></script>
</body>
</html>
