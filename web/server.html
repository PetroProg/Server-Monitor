<!DOCTYPE html>
<html lang="ru" data-theme="obsidian-amber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Server Monitor</title>
  <meta name="theme-color" content="#0d0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Server Monitor">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('sm_settings_v1');
        var cfg = raw ? JSON.parse(raw) : {};
        var colors = { 'obsidian-amber': '#0d0d0f', 'nordic-paper': '#f6f5f0', 'emerald-ops': '#090e0c', 'velvet-coral': '#110e15' };
        var th = colors[cfg.theme] ? cfg.theme : 'obsidian-amber';
        document.documentElement.dataset.theme = th;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', colors[th]);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/themes.css?v=1">
  <link rel="stylesheet" href="/css/app.css?v=1">
</head>
<body>

  <header class="top-header">
    <div class="top-header-inner">
      <div class="brand-wrap">
        <h1 class="brand-title" data-i18n="serverTitle">Сервер petroprog</h1>
        <span id="beszel-badge" class="pill pill-live">
          <span class="dot pulse"></span>
          <span>Beszel Live</span>
        </span>
        <span id="containers-count-badge" class="pill mono">--/--</span>
      </div>

      <nav class="desktop-nav" aria-label="Main">
        <a href="/server" data-nav="server" data-i18n="navServer">Сервер</a>
        <a href="/agents" data-nav="agents" data-i18n="navAgents">Агенты</a>
        <a href="/settings" data-nav="settings" data-i18n="navSettings">Настройки</a>
      </nav>

      <div class="header-actions">
        <button id="refresh-btn" type="button" class="icon-btn" aria-label="Refresh">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-shell">
    <!-- 2x2 Bento KPI Grid -->
    <section class="kpi-grid" aria-label="Server metrics">
      <article class="card kpi-card">
        <div class="kpi-top">
          <span class="kpi-label" data-i18n="kpiCpu">CPU</span>
          <span id="kpi-cpu-sub" class="kpi-sub mono">--°C</span>
        </div>
        <div id="kpi-cpu-val" class="kpi-val mono">--%</div>
        <div id="kpi-cpu-spark" class="spark-wrap"></div>
      </article>

      <article class="card kpi-card">
        <div class="kpi-top">
          <span class="kpi-label" data-i18n="kpiRam">RAM</span>
          <span id="kpi-ram-sub" class="kpi-sub mono">--%</span>
        </div>
        <div id="kpi-ram-val" class="kpi-val mono">-- <small>/ -- GB</small></div>
        <div id="kpi-ram-spark" class="spark-wrap"></div>
      </article>

      <article class="card kpi-card">
        <div class="kpi-top">
          <span class="kpi-label" data-i18n="kpiDisk">SSD</span>
          <span id="kpi-disk-sub" class="kpi-sub mono">--/--G</span>
        </div>
        <div id="kpi-disk-val" class="kpi-val mono">--%</div>
        <div class="bar-track"><div id="kpi-disk-bar" class="bar-fill" style="width: 0%"></div></div>
      </article>

      <article class="card kpi-card">
        <div class="kpi-top">
          <span class="kpi-label" data-i18n="kpiPower">Питание</span>
          <span id="kpi-power-sub" class="kpi-sub mono">--</span>
        </div>
        <div id="kpi-power-val" class="kpi-val mono">--</div>
        <div class="bar-track"><div id="kpi-power-bar" class="bar-fill ok" style="width: 100%"></div></div>
      </article>
    </section>

    <!-- Read-Only Docker Containers Table (Beszel) -->
    <section class="card" aria-label="Docker containers">
      <div class="section-toolbar">
        <h2 class="section-title">
          <span data-i18n="containersTitle">Docker-контейнеры</span>
        </h2>
        <button id="search-toggle-btn" type="button" class="icon-btn" aria-label="Search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </div>

      <div class="filter-chips">
        <button type="button" class="chip active" data-stack-filter="all" data-i18n="filterAll">Все</button>
        <button type="button" class="chip" data-stack-filter="ai_news" data-i18n="filterAi">AI News</button>
        <button type="button" class="chip" data-stack-filter="media_apps" data-i18n="filterMedia">Медиа и сервисы</button>
        <button type="button" class="chip" data-stack-filter="other" data-i18n="filterOther">Прочие</button>
      </div>

      <div id="search-box" class="search-box hidden">
        <input id="container-search-input" type="search" class="search-input" data-i18n-ph="searchPlaceholder" placeholder="Поиск по имени или образу..." autocomplete="off" spellcheck="false">
      </div>

      <div class="ct-head">
        <span data-i18n="colName">Контейнер</span>
        <span data-i18n="colCpu">CPU %</span>
        <span data-i18n="colRam">RAM</span>
      </div>

      <div id="containers-table-body">
        <div class="empty-state">...</div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Mobile Navigation">
    <div class="bottom-nav-inner">
      <a href="/server" class="bottom-tab" data-nav="server">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="7" rx="2"/><rect x="2" y="14" width="20" height="7" rx="2"/><line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
        </svg>
        <span data-i18n="navServer">Сервер</span>
      </a>
      <a href="/agents" class="bottom-tab" data-nav="agents">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        <span data-i18n="navAgents">Агенты</span>
      </a>
      <a href="/settings" class="bottom-tab" data-nav="settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span data-i18n="navSettings">Настройки</span>
      </a>
    </div>
  </nav>

  <script type="module" src="/js/pages/server.js?v=1"></script>
</body>
</html>
